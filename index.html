<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111214">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Редактор скинов Minecraft</title>
<style>
:root{
  /* Layout: menu bar · project tab · tool row with modes | constructor or 2D paint + textures (left) · 3D viewport with block platform (center) · palette, color, structure (right) | status bar with key hints */
  --bg:#111214;
  --panel:#16171a;
  --raise:#1f2024;
  --hover:#2a2c31;
  --line:#0a0b0c;
  --line2:#2b2d33;
  --text:#d6d9e0;
  --muted:#8a909c;
  --accent:#3e90ff;
  --accent-ink:#ffffff;
  --accent2:#2a66c2;--acc-bg:#24426e;--acc-soft:#7fb0ff;--acc-pale:#e6efff;
  --card:#24272e;--card-line:#30343d;--card-hover:#2a2f38;--card-deep:#1d2026;--muted2:#8c93a1;
  --st1:#2a2d35;--st2:#1a1c21;--st3:#0f1012;
  --body:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--line);color:var(--text);font:400 13px/1.45 var(--body);overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:30px 30px auto 1fr 24px;height:100%}
.menubar,.tabsrow,.toolrow,.work{min-width:0}
.spacer{flex:1}

.menubar{display:flex;align-items:center;gap:1px;padding:0 6px;background:#0b0c0d}
.brand{display:flex;align-items:center;gap:7px;margin-right:8px;font-size:15px;font-weight:600;color:#fff;white-space:nowrap}
.brand .cube{width:12px;height:12px;background:linear-gradient(135deg,var(--accent) 0 50%,var(--accent2) 50% 100%);transform:rotate(45deg);border-radius:2px}
.mb{background:none;border:0;color:var(--text);padding:4px 8px;border-radius:3px;font-size:13px;cursor:pointer}
.mb:hover,.mb.open{background:var(--hover)}
.menu{position:fixed;z-index:50;min-width:240px;padding:4px;background:var(--panel);border:1px solid var(--line2);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:0;border-radius:3px;background:none;color:var(--text);font-size:13px;text-align:left;cursor:pointer}
.mi:hover{background:var(--accent);color:#fff}
.mi .k{margin-left:auto;color:var(--muted);font-size:12px}
.mi:hover .k{color:var(--acc-pale)}
.mi .ck{width:14px;text-align:center}
.mi:disabled{opacity:.4;cursor:default;background:none;color:var(--text)}
.msep{height:1px;margin:4px 6px;background:var(--line2)}

.tabsrow{display:flex;align-items:stretch;gap:1px;padding:0 6px;background:#0e0f11}
.ptab{display:flex;align-items:center;gap:7px;padding:0 14px;background:var(--panel);border-top:2px solid var(--accent);font-size:13px;color:#fff}
.ptab .dot{width:7px;height:7px;border-radius:50%;background:#d6d9e0;opacity:0}
.ptab .dot.on{opacity:1}
.ptab-add{background:none;border:0;color:var(--muted);font-size:18px;padding:0 10px;cursor:pointer}
.ptab-add:hover{color:#fff}
.tabsrow .btn{align-self:center;padding:3px 12px}

.toolrow{display:flex;align-items:center;gap:4px;padding:4px 6px;min-height:40px;background:var(--panel);border-bottom:1px solid var(--line)}
.toolbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-width:0;flex:1}
.tb{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 7px;border:1px solid transparent;border-radius:3px;background:none;color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{background:var(--accent);color:#fff}
.tb:disabled{opacity:.35;cursor:default;background:none}
.tb svg{flex:none}
.tsep{width:1px;height:22px;margin:0 5px;background:var(--line2);flex:none}
.tlabel{color:var(--muted);font-size:12px;padding:0 3px;white-space:nowrap}
.num{width:46px;height:26px;padding:0 6px;border:0;border-bottom:2px solid var(--accent);border-radius:2px;background:var(--bg);color:var(--text);font:500 12px ui-monospace,Menlo,Consolas,monospace;text-align:center}
.modes{display:flex;gap:2px;flex:none;align-items:center;margin-right:8px}
.mode{display:inline-flex;align-items:center;gap:6px;height:26px;align-self:center;padding:0 12px;border:0;border-radius:3px;background:none;color:var(--text);font-size:13px;cursor:pointer}
.mode:hover{background:var(--hover)}
.mode.on{background:var(--accent);color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border-radius:3px;border:1px solid var(--line2);background:var(--raise);color:var(--text);font:500 13px var(--body);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.big{width:100%;padding:11px;font-size:15px}

.work{display:grid;grid-template-columns:380px minmax(0,1fr) 320px;min-height:0;gap:2px;background:var(--line)}
.work.wide{grid-template-columns:440px minmax(0,1fr) 320px}
.side{display:flex;flex-direction:column;gap:2px;min-height:0;background:var(--line)}
.pnl{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.pnl.grow{flex:1}
.ph{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;flex:none}
.ph .step{text-transform:none;letter-spacing:0}
.phb{margin-left:auto;display:flex;gap:2px}
.phb button{background:none;border:0;color:var(--muted);font-size:11px;padding:3px 6px;border-radius:3px;cursor:pointer;text-transform:none;letter-spacing:0}
.phb button:hover{background:var(--hover);color:var(--text)}
.phb button[aria-pressed="true"]{color:#fff;background:var(--raise)}
.pb{padding:4px 10px 10px}
.scroll{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:16px;padding:8px 12px 16px}
#pnlPal{flex:none}
#pnlColor{flex:none}
#pnlOut{min-height:150px}
#pnlOut .pb{flex:1;overflow:auto;padding:2px 0}

.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;perspective:1800px;background:radial-gradient(ellipse 46% 58% at 50% 46%,var(--st1) 0%,var(--st2) 55%,var(--st3) 100%);touch-action:none;cursor:grab;user-select:none}
.stage.drag{cursor:grabbing}
.cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.cam.live{transition:none}
.model,.piv,.box{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.face{position:absolute;left:0;top:0;background-repeat:no-repeat;image-rendering:pixelated;backface-visibility:hidden}
.face.plat{background-image:none}
.model.pxgrid .face:not(.plat)::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(10,12,16,.38) 1px,transparent 1px),linear-gradient(90deg,rgba(10,12,16,.38) 1px,transparent 1px);background-size:var(--cx) var(--cy)}
.model.flat .ov{display:none}
.model.paintmode .face:not(.plat){cursor:crosshair}
.model.pick-base .ov .face{pointer-events:none}
.face.plat{pointer-events:none}
.model.noplat .platbox{display:none}
.stage-tip{position:absolute;bottom:8px;left:10px;right:90px;color:var(--muted);font-size:12px;pointer-events:none}
.stage-ui{position:absolute;top:6px;right:8px;display:flex;justify-content:flex-end;gap:3px;flex-wrap:wrap;max-width:60%;pointer-events:none}
.stage-ui > *{pointer-events:auto}
.chip{background:rgba(15,16,18,.9);border:1px solid var(--line2);color:var(--text);border-radius:3px;padding:4px 9px;font:500 12px var(--body);cursor:pointer}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:#fff;background:var(--acc-bg)}
.chip:disabled{opacity:.4;cursor:default}
.zoom{display:inline-flex;gap:2px}
.zoom .chip{min-width:32px;font-variant-numeric:tabular-nums}
.gizmo{position:absolute;right:10px;bottom:10px;width:64px;height:64px;pointer-events:none}

.cats{display:flex;flex-wrap:wrap;gap:2px;padding:0 8px 6px}
body:not([data-mode="build"]) .cats{display:none}
.cat{border:0;background:var(--raise);color:var(--muted);padding:4px 9px;border-radius:3px;font-size:12px;cursor:pointer}
.cat:hover{background:var(--hover);color:var(--text)}
.cat.on{background:var(--accent);color:#fff}
.hint{margin:0;padding:0 12px;color:var(--muted);font-size:12px}
.pfoot{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.pfoot:empty{display:none}
.pfoot .btn{flex:1}

/* outliner */
.orow{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 calc(8px + var(--lv,0) * 16px);font-size:13px;cursor:default}
.orow:hover{background:var(--hover)}
.orow.sel{background:var(--acc-bg)}
.orow.leaf{cursor:pointer}
.orow .car{width:12px;color:var(--muted);font-size:10px;text-align:center;cursor:pointer;flex:none}
.orow svg{flex:none;color:var(--acc-soft)}
.orow.leaf svg{color:var(--acc-soft)}
.orow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eye{width:24px;height:22px;border:0;border-radius:3px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.eye:hover{background:var(--raise);color:var(--text)}
.eye.offv{color:#555a65}

/* palette & color */
.pal{display:grid;grid-template-columns:repeat(16,1fr);gap:0}
.pal button{aspect-ratio:1;border:0;padding:0;cursor:pointer;min-width:0}
.pal button.on{outline:2px solid #fff;outline-offset:-2px;position:relative;z-index:1}
.pal button:hover{outline:1px solid #fff;outline-offset:-1px}
.cprow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cprev{width:30px;height:30px;border-radius:3px;border:2px solid var(--line2);flex:none}
.cpair{position:relative;width:44px;height:40px;flex:none}.cpair .cprev{position:absolute;left:0;top:0;z-index:1}
.cprev2{position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:3px;border:2px solid var(--line2);padding:0;cursor:pointer}
.cswap{position:absolute;left:31px;top:-4px;background:none;border:0;color:var(--muted2);font-size:11px;cursor:pointer;padding:0}.cswap:hover{color:#fff}
.ramp{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}.ramp button{height:22px;border:1px solid #0006;border-radius:2px;padding:0;cursor:pointer}
.ramp button.on{outline:2px solid #fff;outline-offset:-2px}
.cpick{display:grid;grid-template-columns:1fr 16px;gap:8px}
.cpick canvas{width:100%;display:block;border-radius:2px;touch-action:none;cursor:crosshair}
.rgb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.rgb label{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--muted);text-align:center}
.rgb input{width:100%;height:24px;border:0;border-bottom:2px solid var(--accent);background:var(--bg);color:var(--text);text-align:center;font:500 12px ui-monospace,Menlo,Consolas,monospace}
.recent{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.recent button{width:18px;height:18px;border:1px solid rgba(255,255,255,.15);border-radius:2px;padding:0;cursor:pointer}

/* left panel content */
.sec h3{margin:0 0 7px;font:600 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.note{margin:-2px 0 8px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:8px 4px 6px;border-radius:4px;border:1px solid var(--line2);background:var(--raise);color:var(--text);font:400 12px/1.2 var(--body);cursor:pointer;text-align:center;min-height:90px}
.opt:hover{background:var(--hover)}
.opt.on{border-color:var(--accent);background:var(--acc-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.th{image-rendering:pixelated;display:block}
.th.head{height:48px}.th.headFB{height:38px}.th.body{height:72px}.th.bodyFB{height:72px}
.swatches{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sw{width:24px;height:24px;border-radius:3px;border:1px solid rgba(255,255,255,.16);cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--accent);outline-offset:1px}
.custom{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:3px;border:1px dashed var(--line2);color:var(--muted);font-size:12px;cursor:pointer}
.custom input{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer}
.hexwrap{display:inline-flex;align-items:center;gap:6px;padding:2px 3px 2px 8px;border-radius:3px;border:1px solid var(--line2);background:var(--bg);font-size:11px;color:var(--muted);letter-spacing:.05em}
.hex{width:80px;padding:4px 6px;border:0;border-radius:2px;background:var(--raise);color:var(--text);font:500 12px ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
.hex.bad{outline:2px solid #e5534b}
.howto{display:grid;gap:6px;margin:0;padding:10px 12px;border-radius:4px;background:var(--raise);border:1px solid var(--line2);list-style:none;counter-reset:s}
.howto li{counter-increment:s;display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:12px}
.howto li::before{content:counter(s);width:20px;height:20px;border-radius:3px;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700;font-size:11px}
.field{width:100%;padding:8px 10px;border-radius:3px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font:400 14px var(--body)}
.tex{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:start}
.tex img{width:128px;height:128px;image-rendering:pixelated;border-radius:3px;background:repeating-conic-gradient(var(--raise) 0 25%,var(--panel) 0 50%) 0 0/16px 16px}
.tex p{margin:0;color:var(--muted);font-size:12px}
.inst{display:grid;gap:8px}
.inst div{padding:8px 10px;border-radius:3px;background:var(--raise);border:1px solid var(--line2);font-size:13px}
.inst b{display:block;margin-bottom:2px}
.inst .muted{color:var(--muted);font-size:12px;border:0;padding:0;background:none}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px 6px;border-radius:4px;border:1px dashed var(--line2);background:none;color:var(--muted);font:400 12px var(--body);cursor:pointer;min-height:84px;justify-content:center;text-align:center}
.slot.full{border-style:solid;background:var(--raise);color:var(--text)}
.slot.cur{border-color:var(--accent)}
.slot .th{height:38px}
.slot .x{position:absolute;top:2px;right:3px;width:20px;height:20px;border-radius:3px;border:0;background:none;color:var(--muted);cursor:pointer}
.slot .x:hover{color:#ff8a80}
.foot-note{color:var(--muted);font-size:11px}
.tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
body.dropping .app::after{content:'Отпусти файл, чтобы открыть скин';position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:8px;background:rgba(10,14,22,.82);color:var(--acc-pale);font-size:20px;display:flex;align-items:center;justify-content:center;z-index:999;pointer-events:none}
 body.simple .adv{display:none!important}
body.simple[data-mode=build] .side.right,body.simple[data-mode=build] .status,body.simple[data-mode=export] .side.right,body.simple[data-mode=export] .status{display:none}
body.simple[data-mode=export] .app{grid-template-rows:30px 30px auto 1fr}
body.simple[data-mode=export] .work{grid-template-columns:380px minmax(0,1fr)}
body.simple[data-mode=build] .work{grid-template-columns:380px minmax(0,1fr)}
body.simple[data-mode=build] .app{grid-template-rows:30px 30px auto 1fr}
body.simple #pnlColor{flex:1}
#uiBtn{margin-right:6px}
@media (max-width:1100px){body.simple[data-mode=build] .work,body.simple[data-mode=export] .work{grid-template-columns:340px minmax(0,1fr)}}
@media (max-width:900px){body.simple[data-mode=build] .work,body.simple[data-mode=export] .work{grid-template-columns:1fr}body.simple[data-mode=build] .app{grid-template-rows:auto auto auto auto}}
#phint,#pstep,.stage-tip,.note.hide{display:none!important}
h3 .info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:6px;border-radius:50%;border:1px solid #4a505c;color:var(--muted2);font-size:9.5px;font-weight:600;cursor:help;vertical-align:1px;text-transform:none;letter-spacing:0}
h3 .info:hover,h3 .info:focus{color:#fff;border-color:var(--accent);outline:none}
.start{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:min(440px,80vw)}
.startc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;background:var(--card);border:1px solid var(--card-line);border-radius:8px;color:#e6e9ef;font:inherit;text-align:left;cursor:pointer}
.startc i{font-style:normal;font-size:22px;color:var(--accent);line-height:1;margin-bottom:6px}.startc b{font-size:14px}.startc small{color:var(--muted2);font-size:12px}
.startc:hover,.startc:focus-visible{border-color:var(--accent);background:var(--card-hover);outline:none}
@media (max-width:520px){.start{grid-template-columns:1fr}}
body:not([data-mode=paint]) .paintonly{display:none!important}
.trytag{background:var(--accent)!important;color:#fff!important}
.beforetag{position:absolute;left:12px;top:10px;z-index:5;background:#e8a33d;color:#111;font-weight:700;font-size:12px;padding:3px 8px;border-radius:4px;pointer-events:none}
#pnlRef .pb{max-height:240px;overflow:auto}#refBody canvas{width:100%;display:block;cursor:crosshair;image-rendering:auto;border-radius:3px}
#refBody .empty{color:#6c7280;font-size:12px;padding:6px 0}
.lylist{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow:auto}
.lyrow{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;background:var(--card-deep);cursor:pointer;border:1px solid transparent}
.lyrow.on{border-color:var(--accent);background:var(--acc-bg)}.lyrow .lyname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lyrow small{color:#7c8392}
.lyrow input.field{flex:1;padding:2px 4px;height:auto}
.lyop{align-items:center;gap:6px;margin-top:6px}.lybtns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
@media (max-height:820px){#svC{height:104px}#hueC{height:104px!important}.pal button{aspect-ratio:auto;height:13px}}
.rtabs:not([hidden])~.rt .ph{font-size:0;min-height:28px;justify-content:flex-end}.rtabs:not([hidden])~.rt .ph .phb{font-size:12px}
.side.right .rt:not(.rton){display:none!important}.side.right .rt.rton{flex:1}
#pnlRef .pb{max-height:none}.rt .pb{overflow:auto}
.rtabs{display:flex;gap:0;background:var(--panel);border-bottom:1px solid var(--line2)}.rtabs[hidden]{display:none}
.rtabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted2);font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 4px;cursor:pointer}
.rtabs button[aria-selected=true]{color:#e6e9ef;border-bottom-color:var(--accent)}
.modal.dock{background:transparent;align-items:flex-end;justify-content:flex-end;pointer-events:none}.modal.dock .dlg{pointer-events:auto;margin:0 300px 76px 0;box-shadow:0 10px 40px #000a}
@media (max-width:900px){.modal.dock .dlg{margin:0 8px 72px;max-width:calc(100vw - 16px)}}
.adjrow{align-items:center;gap:8px;margin-top:10px;flex-wrap:nowrap}.adjrow input{flex:1;min-width:0;width:auto}.adjrow .tlabel{width:96px;flex:none}.adjrow .edinfo{width:34px;flex:none;text-align:right}
@media (max-width:520px){.adjrow .tlabel{width:92px;font-size:11px}}
.tplf{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.tplc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 6px;background:var(--card);border:1px solid var(--card-line);border-radius:6px;color:#c9ced8;font:inherit;font-size:11.5px;cursor:pointer;min-width:0}
.tplc img{width:100%;aspect-ratio:3/4;object-fit:cover;image-rendering:pixelated;background:var(--card-deep);border-radius:4px}
.tplc img:not([src]){background:linear-gradient(90deg,var(--card-deep),#262a32,var(--card-deep));background-size:200% 100%;animation:tplsk 1s linear infinite}
@keyframes tplsk{to{background-position:-200% 0}}
.tplc{position:relative}.tplc .x{position:absolute;top:2px;right:4px;color:var(--muted2);font-size:11px;padding:2px 4px;border-radius:3px}.tplc .x:hover{color:#fff;background:#c0392b}
.addslot{justify-content:center;border-style:dashed;min-height:120px}.addslot i{font-style:normal;font-size:26px;color:var(--accent);line-height:1}
.myrow{margin-bottom:6px}
.tplc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tplc:hover{border-color:var(--accent);background:var(--card-hover)}.tplc:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ed{overflow:auto;max-height:62vh;border-radius:2px;background:#0c0d0f}
.ed canvas{display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.edbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:6px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:3px;border:1px solid #6b5420;background:#2b2516;font-size:12px}
.banner .btn{padding:4px 8px;font-size:12px}
.check-ok{padding:8px 10px;border-radius:3px;border:1px solid #2f6b4a;background:#15281e;font-size:12px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.edinfo{font-size:12px;font-variant-numeric:tabular-nums}
.texitem{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:3px;background:var(--raise)}
.texitem img{width:40px;height:40px;image-rendering:pixelated;background:repeating-conic-gradient(var(--raise) 0 25%,var(--panel) 0 50%) 0 0/8px 8px}
.texitem b{display:block;font-weight:500}
.texitem small{color:var(--muted)}

.status{display:flex;align-items:center;gap:14px;padding:0 10px;background:#0b0c0d;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
.status span{overflow:hidden;text-overflow:ellipsis}
.status #edInfo{color:var(--text)}
.kh b{display:inline-block;padding:0 5px;margin-right:4px;border-radius:3px;background:var(--raise);color:var(--text);font-weight:500}

.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.5)}
.modal[hidden]{display:none}
.dlg{width:min(460px,calc(100% - 32px));max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:4px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.dlg .ph{justify-content:space-between}
.dlg table{width:100%;border-collapse:collapse;font-size:13px}
.dlg td{padding:6px 12px;border-bottom:1px solid var(--line2)}
.dlg td:last-child{text-align:right;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.tour{position:fixed;inset:0;z-index:65;pointer-events:none}
.tour-hl{position:fixed;border:2px solid var(--accent);border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none}
.tour-card{position:fixed;pointer-events:auto;padding:12px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--accent);box-shadow:0 12px 32px rgba(0,0,0,.5);display:grid;gap:6px}
.tour-card .step{font-size:11px;color:var(--muted)}.tour-card p{margin:0;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--panel);border:1px solid var(--accent);color:var(--text);padding:8px 14px;border-radius:4px;font-size:13px;transition:.2s;pointer-events:none;z-index:70;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){.work{grid-template-columns:340px minmax(0,1fr) 280px}.work.wide{grid-template-columns:380px minmax(0,1fr) 280px}.kh{display:none}}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-rows:auto auto auto auto 24px}
  .menubar{flex-wrap:wrap;padding:4px 6px}
  .toolrow{flex-wrap:wrap;padding:4px 6px}
  .tabsrow{flex-wrap:wrap;gap:4px;padding:4px 6px}.tabsrow .spacer{display:none}.ptab{padding:4px 10px}.modes{margin-right:0}.mode{padding:0 8px}
  .work,.work.wide{grid-template-columns:1fr}
  .center{order:1}.side.left{order:2}.side.right{order:3}
  .stage{height:52vh;flex:none}
  .scroll{overflow:visible}
  .status{position:sticky;bottom:0}
}
@media (prefers-reduced-motion:reduce){.cam,.toast{transition:none}}

    for(let x=0;x<8;x++){const lk=Math.min(2,Math.floor(((x+o+9)%9)/3)),len=lockLen[(x+o+9)%9<3?0:lk];

    catch(e){const c=e&&e.code;if(c==='declined')toast('Сохранение отменено');else if(c==='rate_limited')toast('Подожди секунду и нажми ещё раз');else toast('Не получилось сохранить файл');return false}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){}
  toast(okMsg);return true}
function saveProject(){syncE();const data=JSON.stringify({app:'skin-studio',version:1,state},null,0);saveFile(fileName()+'.json',new Blob([data],{type:'application/json'}),'Проект сохранён: '+fileName()+'.json. Открыть — «Файл → Открыть проект»')}
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();document.body.classList.add('dropping')}});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dropping')});
document.addEventListener('drop',e=>{document.body.classList.remove('dropping');const f=e.dataTransfer&&e.dataTransfer.files[0];if(!f)return;e.preventDefault();
  if(e.target&&e.target.closest&&e.target.closest('#pnlRef')&&/^image\//.test(f.type)){loadRef(f);return}
  if(/\.json$/i.test(f.name)||f.type==='application/json')openProject(f);else if(/^image\//.test(f.type)||/\.png$/i.test(f.name)){if(modeOf(cur)!=='paint')goMode('paint');importPNG(f)}else toast('Перетащи PNG-скин или проект .json')});
function openProject(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.app!=='skin-studio'||!d.state||!d.state.top)throw 0;
    pushHist('');state=sanitize(d.state);loadE();update(true);toast('Проект открыт: '+file.name)}
  catch(e){toast('Это не файл проекта Скин-студии. Нужен .json, сохранённый через «Файл → Сохранить проект»')}};r.readAsText(file)}
async function downloadSkin(){
  const fn=fileName()+'.png',blob=await new Promise(r=>skinCv.toBlob(r,'image/png'));
  if(cur!==CATS.length-1)go(CATS.length-1);
  if(NAT){if(await natSaveUI(fn,blob,'Скин сохранён: '+fn)){dirty=false;updTab()}return}
  if(dlApi){try{await dlApi.save({filename:fn,data:blob});dirty=false;updTab();toast('Скин сохранён: '+fn)}
    catch(e){const c=e&&e.code;if(c==='declined')toast('Сохранение отменено');else if(c==='rate_limited')toast('Подожди секунду и нажми ещё раз');else toast('Не получилось скачать. Сохрани картинку ниже правой кнопкой мыши')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){}
  toast('Если файл не скачался — сохрани картинку ниже правой кнопкой мыши');
}

/* ================= wiring ================= */
const stage=$('#stage');
const ptrs=new Map();let pinch=null;
const two=()=>{const [a,b]=[...ptrs.values()];return {d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2}};
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('pointerdown',e=>{if(e.target.closest('#stageUi'))return;
  if(CATS[cur].id==='paint'&&on3d&&(e.button===0||e.button===2)&&ptrs.size===0&&e.target.classList.contains('face')&&!e.target.classList.contains('plat')){const p=resolveAuto(faceTexel(e));
    if(p){e.preventDefault();try{e.target.releasePointerCapture(e.pointerId)}catch(_){}paint3d=strokeStart(p,e,true)?{el:e.target,p}:null;return}}
  stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});targetYaw=null;
  if(ptrs.size===2){drag=null;const t=two();pinch={d:t.d,mx:t.mx,my:t.my,uz,px:panX,py:panY};return}
  const pan=e.button===2||e.button===1||(e.shiftKey&&CATS[cur].id!=='paint');drag={x:e.clientX,y:e.clientY,yaw,pitch,pan,px:panX,py:panY};stage.classList.add('drag')});
stage.addEventListener('pointermove',e=>{
  if(CATS[cur].id==='paint'&&on3d&&!ptrs.size&&e.target.classList&&e.target.classList.contains('face')){const p=resolveAuto(faceTexel(e));
    if(paint3d){if(p){strokeMove(p,e.target===paint3d.el&&sameReg(p,paint3d.p));paint3d.el=e.target;paint3d.p=p}return}if(p){hover=p;queueHover()}}
  else if(!ptrs.size&&!paint3d&&e.target.classList&&e.target.classList.contains('face')){const p=faceTexel(e);if(p){hover=p;queueHover()}}
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const t=two();panX=pinch.px+(t.mx-pinch.mx);panY=pinch.py+(t.my-pinch.my);setZoom(pinch.uz*t.d/Math.max(1,pinch.d),true);return}
  if(!drag)return;
  if(drag.pan){panX=drag.px+(e.clientX-drag.x);panY=drag.py+(e.clientY-drag.y);liveCam();applyZoom();return}
  yaw=drag.yaw+(e.clientX-drag.x)*.6;pitch=Math.max(-30,Math.min(25,drag.pitch-(e.clientY-drag.y)*.3));applyRot()});
const endDrag=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size){drag=null;stage.classList.remove('drag')}};
stage.addEventListener('pointerup',endDrag);window.addEventListener('pointerup',()=>{if(paint3d){paint3d=null;strokeEnd()}});stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('wheel',e=>{e.preventDefault();setZoom(uz*Math.exp(-e.deltaY*.0015),true)},{passive:false});
$('#zIn').onclick=()=>setZoom(uz*1.25);$('#zOut').onclick=()=>setZoom(uz/1.25);$('#zVal').onclick=resetView;
$('#rotL').onclick=()=>{targetYaw=(targetYaw??yaw)-45};
$('#rotR').onclick=()=>{targetYaw=(targetYaw??yaw)+45};
$('#viewF').onclick=()=>{targetYaw=Math.round(yaw/360)*360};
$('#viewB').onclick=()=>{targetYaw=Math.round((yaw-180)/360)*360+180};
$('#ovBtn').onclick=toggleOv;try{if(localStorage.getItem('mcskin.ov')==='0'){$('#ovBtn').setAttribute('aria-pressed','false');$('#model').classList.add('flat')}}catch(e){}
{const ps=$('#poseSel');POSES.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;ps.appendChild(o)});ps.onchange=()=>setPose(ps.value)}
$('#dlBtn').onclick=downloadSkin;
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;const k=(e.code&&e.code.startsWith('Key'))?e.code.slice(3).toLowerCase():e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();redo();return}
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();undo();return}
  if(CATS[cur].id==='paint'&&(e.ctrlKey||e.metaKey)&&(k==='c'||k==='x')&&sel){e.preventDefault();selCopy(k==='x');return}
  if(CATS[cur].id==='paint'&&(e.ctrlKey||e.metaKey)&&k==='v'&&clip){e.preventDefault();selPasteMode();return}
  if(CATS[cur].id==='paint'&&(e.key==='Delete'||e.key==='Backspace')&&sel&&tool==='select'){e.preventDefault();selDelete();return}
  if(e.key==='Escape'&&(sel||pasting)){selClear()}
  if(CATS[cur].id==='paint'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const map={b:'brush',e:'eraser',i:'pick',g:'fill',d:'dark',l:'light',r:'replace',s:'select',t:'dither'};
    if(k==='x'){swapColors();return}if(k==='q'){isolatePart(hover&&regionAt(hover[0],hover[1])?regionAt(hover[0],hover[1]).k:null);return}
    if(k==='c'&&!e.repeat){showBefore(true);return}if(k==='['||k===']'||e.code==='BracketLeft'||e.code==='BracketRight'){brushSize=Math.max(1,Math.min(8,brushSize+((k===']'||e.code==='BracketRight')?1:-1)));renderToolbar('paint');toast('Кисть: '+brushSize+' px');return}
    if(/^Digit[1-7]$/.test(e.code)){const i=+e.code.slice(5)-1;setPaint(toHex(shade(rgb(rampBase||paintColor),RAMP[i])),false,true);return}
    if(map[k]){tool=map[k];if(uiSimple&&!SIMPLE_TOOLS.includes(tool))setSimple(false);else renderToolbar('paint');return}if(k==='m'){mirror=!mirror;renderToolbar('paint');toast(mirror?'Зеркальная кисть включена':'Зеркальная кисть выключена')}}});
new ResizeObserver(()=>fit()).observe(stage);

document.addEventListener('keyup',e=>{if(e.code==='KeyC')showBefore(false)});window.addEventListener('blur',()=>showBefore(false));
{const bb=$('#beforeBtn');bb.onpointerdown=e=>{e.preventDefault();showBefore(true)};bb.onpointerup=bb.onpointerleave=bb.onpointercancel=()=>showBefore(false)}
$('#lyAdd').onclick=addLayer;
$('#refLoad').onclick=()=>$('#refFile').click();$('#refFile').onchange=e=>{const f=e.target.files[0];if(f)loadRef(f);e.target.value=''};$('#refClear').onclick=()=>{refCv=null;renderRef();renderPalette()};renderRef();
applyGift();if(giftMode&&!FIRST_RUN)setTimeout(()=>toast(GT.hi2,3500),400);
if(FIRST_RUN)setTimeout(()=>openStart(true),60);applyUi();$('#uiBtn').onclick=()=>{setSimple(!uiSimple);toast(uiSimple?'Простой вид: только главное. Всё остальное — в меню сверху':'Все инструменты включены')};
loadE();fit();buildModel();update(true);requestAnimationFrame(tick);
